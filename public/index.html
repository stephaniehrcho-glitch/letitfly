<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Hit The Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: scoreboard header band, tabbed views; tracker = standings table + horizontally scrolling bracket per division */
:root{
  --bg:#eef2ee; --panel:#ffffff; --panel2:#f6f8f5; --ink:#13201a; --muted:#5b6b62; --line:#d5ddd6;
  --accent:#1c6b45; --accent-ink:#ffffff; --accent-soft:#dcefe3; --mark:#c98a00; --mark-soft:#fbf0d2;
  --bad:#b3261e; --bad-soft:#fbe3e1; --band:#13241b; --band-ink:#eaf3ec;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --panel:#141e19; --panel2:#18241e; --ink:#e4ece6; --muted:#93a59a; --line:#26352d;
  --accent:#4cc38a; --accent-ink:#06170e; --accent-soft:#173326; --mark:#f0bf4c; --mark-soft:#33290f;
  --bad:#ff8a80; --bad-soft:#3a1714; --band:#0a110d; --band-ink:#e4ece6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --panel:#141e19; --panel2:#18241e; --ink:#e4ece6; --muted:#93a59a; --line:#26352d;
  --accent:#4cc38a; --accent-ink:#06170e; --accent-soft:#173326; --mark:#f0bf4c; --mark-soft:#33290f;
  --bad:#ff8a80; --bad-soft:#3a1714; --band:#0a110d; --band-ink:#e4ece6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
nav.tabs{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:8px}
nav.tabs a{color:var(--band-ink);text-decoration:none;padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;opacity:.75}
nav.tabs a[aria-current="page"]{background:var(--mark);color:#1a1400;opacity:1}
nav.tabs a:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--mark-soft);border-color:transparent}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.mark{background:var(--mark-soft);border-color:transparent;color:var(--ink)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.mono,.yd{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;font-size:13px;border-radius:7px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input.yds{font-family:var(--f-mono);width:7.5em;font-size:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.long{font-weight:700;color:var(--accent)}
.nmlink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.nmlink:hover{text-decoration-color:var(--accent)}
td.pencell,th.pencell{width:40px;padding:4px 8px 4px 0;text-align:right}
.penbtn{background:none;border:0;padding:4px;border-radius:8px}
.penbtn .pen{margin:0;width:28px;height:28px}
.rrrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.rrrow .yds{width:6em;font-size:17px;font-weight:700;text-align:center;border:2px solid var(--accent);border-radius:8px;padding:7px 8px}
.pen{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:5px;border-radius:6px;color:var(--accent);background:var(--accent-soft);vertical-align:-5px}
.pen.on{background:var(--accent);color:var(--accent-ink)}
td.tdedit:active{background:var(--accent-soft)}
td.tbr,th.tbr{position:relative;width:14px;min-width:14px;padding:0}
.br{position:absolute;left:3px;width:6px;border-right:1px solid var(--muted);opacity:.7}
.br.first{top:50%;bottom:-1px;border-top:1px solid var(--muted);border-top-right-radius:4px}
.br.mid{top:-1px;bottom:-1px}
.br.mid::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid var(--muted)}
.br.last{top:-1px;bottom:50%;border-bottom:1px solid var(--muted);border-bottom-right-radius:4px}
.chip.review{margin-left:8px;cursor:pointer;font-size:10px;padding:1px 7px;vertical-align:1px}
.tb{display:inline-block;border:2px solid var(--accent);border-radius:999px;padding:0 6px;margin:-2px -8px -2px 0;line-height:1.35}
tr.cut td{border-top:2px solid var(--mark)}
tr.out td{opacity:.5}
.rank{font-family:var(--f-display);font-weight:700;font-size:16px}
/* bracket */
.bracket{overflow-x:auto;padding-bottom:6px}
.rounds{display:flex;gap:44px;min-width:max-content;align-items:stretch}
.round{display:flex;flex-direction:column;gap:10px;width:230px}
.round>.rl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.round>.ms{display:flex;flex-direction:column;flex:1}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.mw{flex:1;display:flex;align-items:center;position:relative;padding:10px 0}
.mw>.match{width:100%}
.rounds{position:relative}
svg.blines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
svg.blines path{fill:none;stroke:var(--muted);stroke-width:1;opacity:.7}
.round,.champ{position:relative;z-index:1}
.mw.feed{flex-direction:column;justify-content:center;gap:6px}
.round>.champ{position:absolute;left:0;right:0;top:24px;width:auto;margin:0}

.match{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.match .slot{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);min-height:32px}
.match .slot:last-of-type{border-bottom:0}
.slot .seed{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.slot .seed.none{background:transparent}
.slot.lose .seed{opacity:.55}
.slot .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .yd{font-weight:700;font-size:13px}
.slot.win{background:var(--accent-soft)} .slot.win .nm{font-weight:700}
.slot.lose .nm,.slot.lose .yd{color:var(--muted)}
.slot.tbd .nm{color:var(--muted);font-style:italic}
.match .st{font-size:11px;padding:4px 9px;background:var(--panel2);color:var(--muted);border-top:1px solid var(--line)}
.match .st.mark{background:var(--mark-soft);color:var(--ink)}
.match .st.bad{background:var(--bad-soft);color:var(--bad)}
.match .st:has(.stbtn){display:flex;align-items:center;justify-content:space-between;gap:8px}
.stbtn{padding:3px 12px;font-size:12px}
.chip.tiny{font-size:9.5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.setbox.rehit{border-color:var(--mark);background:var(--mark-soft)}
.addset{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);min-height:96px;cursor:pointer}
.addset .plus{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:700}
.champ{align-self:center;border:2px solid var(--mark);border-radius:10px;padding:10px 14px;background:var(--mark-soft);width:200px}
.champ small{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.champ div{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase}
/* entry */
.hcard{display:flex;flex-direction:column;gap:12px}
.sets{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.elist{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.erow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 14px;min-height:56px;color:var(--ink);font-weight:400}
.erow:last-child{border-bottom:0}
.erow.act{background:var(--accent-soft)}
.erow.out{opacity:.55}
.ename{display:flex;align-items:center;font-weight:600;font-size:15px;min-width:0}
.ename span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esub{font-size:12px;color:var(--muted)}
.ecta{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.echev{flex:none;color:var(--muted);font-size:22px;line-height:1}
.sheet{max-height:min(88vh,760px);overflow:auto;padding:14px 16px 18px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--panel);padding:2px 0 8px;z-index:1}
.sheet .hcard{border:0;padding:0;background:transparent;gap:10px}
.sheet .hcard>.sechead:first-child{display:none}
.sheet .setbox{padding:9px}
.sheet .big{font-size:20px}
.sheet .sets{display:flex;flex-direction:column;gap:8px}
.sheet .setbox{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sheet .setbox:has(input.yds:not([disabled])){border:2px solid var(--accent);background:var(--panel);padding:11px 13px}
.sheet .setbox.rehit{background:var(--mark-soft);border-color:var(--mark)}
.sheet .setbox>*{grid-column:1}
.sheet .setbox>.big,.sheet .setbox>.row:not(.sh){grid-column:2;grid-row:1/span 2;justify-self:end}
.sheet .setbox>.confirm,.sheet .setbox>.note{grid-column:1/-1}
.sheet .setbox>.chip{justify-self:start}
.sheet .setbox .sh{gap:8px;justify-content:flex-start!important}
.sheet .setbox .sh strong{font-size:14.5px}
.sheet .setbox .big{font-size:18px}
.sheet .setbox .row:not(.sh){flex-wrap:nowrap;gap:6px}
.sheet .setbox .yds{width:5.6em;font-size:18px;font-weight:700;padding:8px 10px;border:2px solid var(--accent);border-radius:8px;background:var(--panel);text-align:center}
.sheet .setbox .yds:disabled{border:1px dashed var(--line);background:transparent}
.sheet .setbox .yds::placeholder{font-weight:500;color:var(--muted)}
.sheet .setbox button{padding:9px 13px}
.sheet .addset{flex-direction:row;gap:8px;min-height:0;padding:12px 14px;border:1px dashed var(--accent);border-radius:10px;justify-content:center;background:transparent}
.sheet .addset .plus{font-size:20px}
@media (max-width:380px){.sheet .setbox{grid-template-columns:1fr}.sheet .setbox>.big,.sheet .setbox>.row:not(.sh){grid-column:1;grid-row:auto;justify-self:start}}
.sheet .hcard .sec{border-top:0!important;padding-top:4px!important;gap:6px}
@media (max-width:600px){.sheet-back{place-items:end center;padding:0}.sheet{max-width:100%;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
.setbox{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.big{font-family:var(--f-mono);font-size:24px;font-weight:700}
.confirm{background:var(--mark-soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.phases{display:flex;flex-wrap:wrap;gap:6px}
.phases span{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.phases span.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.phases span.done{color:var(--accent);border-color:var(--accent)}
.track{position:relative;padding-block:4px 2px}
.track .rail{position:absolute;left:12.5%;right:12.5%;top:17px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.track .fill{height:100%;width:var(--pct);background:var(--accent);border-radius:3px}
.track .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.track .step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.track .dot{width:31px;height:31px;border-radius:50%;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.track .step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.track .step.now .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.track .step.now .dot::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent)}
.track .step strong{font-size:13px}
.track .step:not(.done):not(.now) strong{color:var(--muted)}
.track .cap{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.track .fill{transition:width .7s ease}.track .step.now .dot::after{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(.6);opacity:.55}}
@media (max-width:480px){.track .step strong{font-size:11.5px}.track .cap{font-size:10px}}
.roster{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow.out .rmain{opacity:.5}
.rname{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:14px;display:flex;align-items:center;min-width:0;max-width:100%;cursor:pointer;color:var(--ink)}
.rname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname:hover span:last-child{text-decoration:underline}
.rsub{display:flex;flex-wrap:wrap;column-gap:0;font-size:11.5px;color:var(--muted);min-width:0}
.rsub>span+span::before{content:"·";margin:0 6px;color:var(--muted);font-weight:400}
.rsub .rem{max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub .ok{color:var(--accent);font-weight:600}
.racts{display:flex;gap:6px;align-items:center;flex:none}
.pill{border-radius:999px;padding:3px 11px;font-size:12px}
.pill.danger{color:var(--bad);border-color:var(--line)}
.pill.danger:hover{border-color:var(--bad)}
button.solidbtn{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.pill:disabled,.locked{opacity:.42}
.locked{cursor:not-allowed}
.lrow{flex-wrap:wrap}
.lsel{display:flex;gap:8px;flex-wrap:wrap}
.lsel select{max-width:15em}
.pick{max-height:min(50vh,420px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.pickrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow:last-child{border-bottom:0}
.pickrow input{width:18px;height:18px;flex:none}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pform .wide{grid-column:1/-1}
.pform select,.pform input{width:100%}
.warnback{z-index:40}
.shlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:min(50vh,420px);overflow:auto}
.shrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.shrow:last-child{border-bottom:0}
.shrow .ename{font-size:14px}
.shrow .esub{text-align:right;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toastbtn{margin-left:10px;background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:999px;padding:3px 12px;font-weight:700}
.rrsum .row:not(.sh){align-items:center;gap:8px}
.modal-back{position:fixed;inset:0;z-index:30;background:rgba(8,14,11,.55);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{width:100%;max-width:480px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal textarea{width:100%}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;margin-right:6px;font-size:1.05em;line-height:1}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:-6px}
.subtabs button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:9px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.li.focus{background:var(--mark-soft);border-radius:8px;padding-left:8px;padding-right:8px;outline:2px solid var(--mark)}
.subnav{display:flex;flex-wrap:wrap;gap:8px}
.subnav button{border-radius:999px;padding:8px 16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.subnav button:hover{border-color:var(--accent)}
.subnav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.cols>*{min-width:0}

<script>
(function(){
"use strict";
/* ---------- state ---------- */
const S={db:null,user:null,me:{id:null,isOwner:false},canWrite:null,
  event:null,admin:{},joins:{},rr:{},commits:{},reveals:{},vault:{},aheadUse:[],
  loaded:false,stale:false,noDb:false,profiles:{},brackets:[],keyIndex:{},
  confirm:null,busy:false,revealing:false,seedDraft:{},testN:28};
const D={}; // input drafts
const vcache={};
const VIEWS=["tracker","enter","director"];
const view=()=>{if(S.view&&VIEWS.includes(S.view))return S.view;const h=(location.hash||"").slice(1);return VIEWS.includes(h)?h:"tracker"};

  set(v){const a=pastArc();if(a)S.archive[S.past]=Object.assign({},a,{admin:{rr:v.rr||{},mpWinner:v.mpWinner||{},mpVal:v.mpVal||{},undo:(v.undo||[]).slice(-50)}});else S._admin=v;}});

/* ---------- helpers ---------- */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const rid=p=>p+Math.random().toString(36).slice(2,10);
function el(tag,props,...kids){const e=document.createElement(tag);let val;
  if(props&&props.lockReason){const why=props.lockReason;props=Object.assign({},props,{lockReason:null,onclick:ev=>{ev&&ev.preventDefault&&ev.preventDefault();toast(why);},"aria-disabled":"true",class:(props.class||"")+" locked"});}

  e.value=key in D?D[key]:def;e.addEventListener("input",()=>{D[key]=e.value});return e;}
const fmt=v=>v==null||v===""?"—":(Math.round(v*10)/10).toString();
const tstr=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
let toastT;function toast(m,act){const t=document.getElementById("toast");t.textContent=m;
  if(act&&t.append){const b=document.createElement("button");b.className="toastbtn";b.textContent=act.label;b.onclick=()=>{t.hidden=true;act.fn();};t.append(" ",b);}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,act?7000:2600);}
function parseYds(s){const v=Number(String(s).trim());if(!String(s).trim()||!isFinite(v)||v<0||v>700)return null;return Math.round(v*10)/10;}
async function sha(str){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

const queues={};
function write(path,data){const p=(queues[path]||Promise.resolve()).then(()=>S.db.doc(path).set(data));queues[path]=p.catch(()=>{});return p;}

/* ---------- defaults ---------- */
function defaultEvent(){const d=new Date();return{
  name:"Satellite League Event",date:d.toISOString().slice(0,10),rrSets:3,balls:6,mpBalls:6,
  divisions:[{id:"d1",name:"Champions",size:10,fill:"playin"},{id:"d2",name:"Competitors",size:8,fill:"playin"},{id:"d3",name:"Contender",size:0,fill:"playin"}],
  hitters:[],assign:{},phase:"setup",seeding:null,rehits:{}};}
const EV=()=>S.event;
const EK=()=>EV()?.eid?EV().eid+":":"";const nk=hid=>EK()+hid;

const hitter=id=>(EV()?.hitters||[]).find(h=>h.id===id);

const idOf=a=>(a||[]).find(x=>!x.includes(":")&&x!=="noself");

  if(h&&h.site&&!a.includes("noself"))facs.add(h.site);return{me,h,facs,people:new Set(a.filter(x=>x.startsWith("for:")).map(x=>x.slice(4)))};}

  const site=hitter(hid)?.site;return!!site&&p.facs.has(site);}
const isOut=x=>x==="BYE"||hitter(x)?.status==="withdrawn";

/* ---------- countries ---------- */
const CC="AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW".split(" ");
const SUB={"GB-ENG":"England","GB-SCT":"Scotland","GB-WLS":"Wales","GB-NIR":"Northern Ireland"};
let DN=null;try{DN=new Intl.DisplayNames(["en"],{type:"region"})}catch(e){}
const cName=c=>!c?"":SUB[c]||(DN&&DN.of(c))||c;
function flagEmoji(c){if(!c)return"";if(c==="GB-NIR")return"\u{1F1EC}\u{1F1E7}";
  if(SUB[c])return"\u{1F3F4}"+[...c.toLowerCase().replace("-","")].map(ch=>String.fromCodePoint(0xE0000+ch.charCodeAt(0))).join("")+"\u{E007F}";
  return[...c].map(ch=>String.fromCodePoint(0x1F1E6+ch.charCodeAt(0)-65)).join("");}
const flc=c=>c?el("span",{class:"flag",onclick:()=>toast(cName(c)),role:"img","aria-label":cName(c)},flagEmoji(c)):null;
const fl=id=>flc(hitter(id)?.country);
const ALIAS={USA:"US",UK:"GB","UNITED STATES":"US","UNITED KINGDOM":"GB",ENGLAND:"GB-ENG",SCOTLAND:"GB-SCT",WALES:"GB-WLS","NORTHERN IRELAND":"GB-NIR"};
function parseCountry(t){t=(t||"").trim();if(!t)return"";const u=t.toUpperCase();if(CC.includes(u)||SUB[u])return u;if(ALIAS[u])return ALIAS[u];
  return CC.find(c=>cName(c).toLowerCase()===t.toLowerCase())||"";}
function parseLine(l){const parts=l.split(",").map(x=>x.trim());const name=parts.shift();let country="",email="";const site=[];const locs=facList().map(f=>f.label);
  for(const x of parts){if(!x)continue;if(!email&&x.includes("@")){email=x.toLowerCase();continue;}const c=!country&&parseCountry(x);if(c){country=c;continue;}
    site.push(locs.find(L=>L.toLowerCase()===x.toLowerCase())||x);}
  return{id:rid("h"),name,country,email,site:site.join(", "),status:"active",addedAt:Date.now()};}
const COMMON=["CA","US","GB-ENG","GB-SCT","GB-WLS","GB-NIR","IE","AU","NZ","ZA","MX","JP","KR","SE","DE"];
let ALLSORT=null;
function countrySelect(id,value,onchange,label){ALLSORT=ALLSORT||CC.slice().sort((a,b)=>cName(a).localeCompare(cName(b)));
  const o=c=>el("option",{value:c},flagEmoji(c)+" "+cName(c));
  return el("select",{id,"aria-label":label||"Country",value:value||"",onchange},el("option",{value:""},"Country…"),el("optgroup",{label:"Common"},COMMON.map(o)),el("optgroup",{label:"All countries"},ALLSORT.map(o)));}

/* ---------- round robin ---------- */
function rrCell(hid,i){const o=S.admin?.rr?.[hid]?.[i];if(typeof o==="number")return{v:o,src:"td"};
  let best=null;const all=[];for(const [u,d] of Object.entries(S.rr)){if(!assigned(u,hid))continue;const c=d?.e?.[nk(hid)]?.[i];
    if(c&&typeof c.v==="number"){all.push({u,v:c.v,at:c.at,off:c.off,qd:c.qd});
      if(!best||c.at>best.at)best={v:c.v,at:c.at,uid:u,src:"entry",edited:!!(c.hist&&c.hist.length),off:c.off,qd:c.qd};}}
  // Two people entered different numbers for the same set: flag it for the director.
  if(best){const other=all.filter(x=>x.u!==best.uid&&x.v!==best.v);if(other.length)best.conflict=other;}
  return best;}
function ranking(){const ev=EV();if(!ev)return[];const n=ev.rrSets;
  const rows=ev.hitters.filter(h=>h.status!=="withdrawn").map(h=>{const cells=[...Array(n)].map((_,i)=>rrCell(h.id,i));
    const vals=cells.filter(Boolean).map(c=>c.v).sort((a,b)=>b-a);return{h,cells,vals,long:vals.length?vals[0]:null}});
  const cmp=(a,b)=>{for(let i=0;i<Math.max(a.vals.length,b.vals.length);i++){const x=a.vals[i]??-1,y=b.vals[i]??-1;if(x!==y)return y-x;}return 0};
  rows.sort((a,b)=>cmp(a,b)||a.h.name.localeCompare(b.h.name));
  rows.forEach((r,i)=>{r.rank=i+1;r.tie=r.vals.length>0&&((i>0&&cmp(r,rows[i-1])===0)||(i<rows.length-1&&cmp(r,rows[i+1])===0));});
  const firstDiff=(a,b)=>{for(let k=0;k<Math.max(a.vals.length,b.vals.length);k++)if((a.vals[k]??-1)!==(b.vals[k]??-1))return k;return -1;};
  rows.forEach((r,i)=>{r.tbCells=new Set();r.longTie=false;if(!r.vals.length)return;r.longTie=[rows[i-1],rows[i+1]].some(o=>o&&o.vals.length&&o.vals[0]===r.vals[0]);const ks=new Set();
    for(const o of [rows[i-1],rows[i+1]])if(o&&o.vals.length&&o.vals[0]===r.vals[0]){const k=firstDiff(r,o);if(k>0&&k<r.vals.length)ks.add(k);}
    if(!ks.size)return;const order=r.cells.map((c,j)=>[c?c.v:null,j]).filter(x=>x[0]!=null).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(x=>x[1]);
    ks.forEach(k=>{if(order[k]!=null)r.tbCells.add(order[k]);});});
  for(let i=0;i<rows.length;){let j=i;while(j+1<rows.length&&rows[i].vals.length&&rows[j+1].vals.length&&rows[j+1].vals[0]===rows[i].vals[0])j++;
    if(j>i)for(let k=i;k<=j;k++)rows[k].tg=k===i?"first":k===j?"last":"mid";i=j+1;}
  rows.forEach(r=>{if(r.tie){const key=r.vals.join(",");r.tieWith=rows.filter(o=>o!==r&&o.vals.join(",")===key).map(o=>o.h.name);}});
  return rows;}
function project(ids,divs){const out=[];let i=0;
  for(const d of divs){const size=d.size>0?d.size:Infinity;const seeds=ids.slice(i,i+size);i+=seeds.length;out.push({id:d.id,name:d.name,fill:d.fill,seeds});}
  return{divs:out,leftover:ids.slice(i)};}

/* ---------- bracket engine ---------- */
function seedPositions(n){let p=[1,2];while(p.length<n){const m=p.length*2+1;p=p.flatMap(s=>[s,m-s]);}return p;}
function roundLabel(n){return n===2?"Finals":n===4?"Final 4":n===8?"Elite 8":n===16?"Sweet 16":"Round of "+n;}
function shape(N,fill){if(N<2)return{B:N,extra:0,byes:0};
  if(fill==="bye"){const B=2**Math.ceil(Math.log2(N));return{B,extra:0,byes:B-N};}
  const B=2**Math.floor(Math.log2(N));return{B,extra:N-B,byes:0};}
function shapeText(N,fill){if(N===0)return"No hitters";if(N===1)return"1 hitter, no bracket";const s=shape(N,fill);
  return N+" hitters · "+(s.extra?s.extra+" play-in match"+(s.extra>1?"es":"")+" → ":s.byes?s.byes+" bye"+(s.byes>1?"s":"")+" → ":"")+roundLabel(s.B);}
function buildBracket(div){const N=div.seeds.length,ver=div.ver||"t",rounds=[];if(N<2)return rounds;

  for(let s=1;s<=B;s++)slot[s]=s<=N?{seed:s}:{bye:true};
  if(extra>0){const ms=[];for(let i=0;i<extra;i++){const id=`${ver}:${div.id}:0:${i}`;ms.push({id,a:{seed:L+i},b:{seed:N-i}});slot[L+i]={win:id};}
    rounds.push({label:"Play-In",matches:ms});}
  const order=seedPositions(B),r0=[],ri=rounds.length;
  for(let k=0;k<B/2;k++)r0.push({id:`${ver}:${div.id}:${ri}:${k}`,a:slot[order[2*k]],b:slot[order[2*k+1]]});

  while(cur.length>1){const rix=rounds.length,nx=[];for(let k=0;k<cur.length/2;k++)nx.push({id:`${ver}:${div.id}:${rix}:${k}`,a:{win:cur[2*k].id},b:{win:cur[2*k+1].id}});

  return rounds;}
const mkey=id=>EK()+id+"#"+((EV()?.rehits||{})[id]||0);
function aheadOf(hid){const out={};for(const [u,d] of Object.entries(S.commits)){if(!assigned(u,hid))continue;
  for(const [k,c] of Object.entries(d?.ahead?.[nk(hid)]||{}))if(c&&c.h&&(!out[k]||c.at<out[k].c.at))out[k]={u,c};}return out;}
// Sealed entries: the one the server received first counts. (rt is stamped by
// the server on arrival; older entries without it fall back to the typed time.)
const ordT=c=>c.rt??c.at;
function pickEntry(key,hid,idx){let d=null,a=null;
  for(const [u,doc] of Object.entries(S.commits)){if(!assigned(u,hid))continue;
    const c=doc?.m?.[key]?.[hid];if(c&&c.h&&(!d||ordT(c)<ordT(d.c)))d={u,c};
    if(idx!=null){const x=doc?.ahead?.[nk(hid)]?.[idx];if(x&&x.h&&(!a||ordT(x)<ordT(a.c)))a={u,c:x};}}

function startMs(ev){if(!ev||!ev.date||!ev.time)return null;const [y,mo,d]=ev.date.split("-").map(Number),[h,mi]=ev.time.split(":").map(Number);if([y,mo,d,h].some(isNaN))return null;
  const guess=Date.UTC(y,mo-1,d,h,mi||0);if(!ev.tz)return null;let t=guess-tzOffset(ev.tz,guess);t=guess-tzOffset(ev.tz,t);return t;}
const tzAbbr=(tz,ms)=>{try{return new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"}).formatToParts(new Date(ms)).find(x=>x.type==="timeZoneName")?.value||"";}catch(e){return"";}};
const tzLabel=tz=>(COMMON_TZ.find(x=>x[0]===tz)||[])[1]||tz.replace(/_/g," ");
// "9:30 AM EST" — and, with local:true, "(10:30 AM your time)" if the viewer is elsewhere.
function evTime(ev,o={}){if(!ev||!ev.time)return"";const t=timeText(ev.time);if(!ev.tz)return t;const ms=startMs(ev);if(ms==null)return t;
  let out=t+" "+tzAbbr(ev.tz,ms);
  const vz=o.local?(o.tz||viewerTZ()):"";
  if(vz&&vz!==ev.tz&&tzOffset(vz,ms)!==tzOffset(ev.tz,ms)){const lt=new Date(ms);const sameDay=lt.toLocaleDateString("en-CA",{timeZone:vz})===ev.date;
    out+=` (${lt.toLocaleTimeString([], {timeZone:vz,hour:"numeric",minute:"2-digit"})}${sameDay?"":" "+lt.toLocaleDateString([], {timeZone:vz,weekday:"short"})} your time)`;}
  return out;}

// Copies each facility's time zone into the live event, so hitters' phones
// (which can't read the private library) know where each facility is.
function syncSiteTZ(){const ev=EV();if(!ev||!S.libLoaded||!S.lib||S.tzBusy)return;const map={};
  for(const f of Object.values(S.lib.facilities||{}))if(f&&f.tz&&!f.archived)map[facLabel(f)]=f.tz;
  if(JSON.stringify(map)===JSON.stringify(ev.siteTZ||{}))return;S.tzBusy=true;saveEvent(e=>{e.siteTZ=map;}).finally(()=>{S.tzBusy=false;});}
// The viewer's zone: their facility's, if they're linked to one; otherwise their phone's.
function viewerTZ(){const ev=EV(),a=(ev?.assign||{})[S.me.id]||[];
  for(const x of a){const site=x.startsWith("loc:")?x.slice(4):x.startsWith("for:")?null:hitter(x)?.site;const z=site&&ev.siteTZ?.[site];if(z)return z;}
  return myTZ;}
// Start time at each facility in the roster (or all facilities with a zone).
function facilityTimes(ev){const ms=startMs(ev);if(ms==null)return[];const z=ev.siteTZ||{};
  const sites=new Set((ev.hitters||[]).filter(h=>h.status!=="withdrawn").map(h=>h.site));const use=Object.keys(z).filter(s=>!sites.size||sites.has(s));
  const groups=new Map();for(const s of use){const k=z[s];if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s.split(" - ").pop());}
  const evDay=ev.date;
  return [...groups].map(([zone,names])=>{const d=new Date(ms);const t=d.toLocaleTimeString([], {timeZone:zone,hour:"numeric",minute:"2-digit"});
    const day=d.toLocaleDateString("en-CA",{timeZone:zone});return `${names.join(", ")} ${t} ${tzAbbr(zone,ms)}${day!==evDay?" "+d.toLocaleDateString([], {timeZone:zone,weekday:"short"}):""}`;})
    .sort();}
function facilityTimesNote(ev){const t=facilityTimes(ev);if(!t.length)return null;return el("p",{class:"muted small",style:"margin:0"},el("strong",{text:"At each facility: "}),t.join(" · "));}
function tzSelect(id,value,onchange){const all=(()=>{try{return Intl.supportedValuesOf("timeZone");}catch(e){return[];}})();const common=new Set(COMMON_TZ.map(x=>x[0]));
  return el("select",{id,value:value||"",onchange},el("option",{value:""},"Choose a time zone"),
    el("optgroup",{label:"Common"},...COMMON_TZ.map(([z,l])=>el("option",{value:z},l))),
    all.length?el("optgroup",{label:"All time zones"},...all.filter(z=>!common.has(z)).map(z=>el("option",{value:z},z.replace(/_/g," ")))):null,
    value&&!common.has(value)&&!all.includes(value)?el("option",{value},value):null);}

/* ---------- event details for any event ---------- */
const timeText=t=>{if(!t)return"";const [h,m]=t.split(":").map(Number);if(isNaN(h))return t;return new Date(2000,0,1,h,m||0).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});};
// Saves name/date/time/location for the live event (id null) or a past event.
async function saveDetails(id,patch){const label=Object.entries(patch).map(([k,v])=>`${{name:"name",date:"date",time:"start time",tz:"time zone",venue:"location"}[k]||k} → ${(k==="tz"&&v?tzLabel(v):v)||"(blank)"}`).join(", ");
  if(!id)return saveEvent(e=>Object.assign(e,patch),"Event details: "+label);
  const arc=clone(S.archive[id]);Object.assign(arc.event,patch);arc.editedAt=Date.now();S.archive[id]=arc;schedule();
  try{await write("archive/"+id,arc);const L=clone(S._admin)||{};L.log=[{at:Date.now(),t:`Past event “${arc.event.name}”: details ${label}`,ev:S._event?.eid||""}].concat(L.log||[]).slice(0,300);S._admin=L;await write("admin/state",L);toast("Saved");}
  catch(e){toast("Couldn't save: "+(e?.message||"error"));}}
function detailsForm(ev,id){const k=id||"live";const f=(key,label,type)=>el("label",{class:"f"},label,el("input",{id:"ed_"+k+"_"+key,type:type||"text",value:ev[key]||"",
    onchange:e=>{const v=e.target.value.trim();if(key==="name"&&!v){e.target.value=ev.name||"";return toast("The event needs a name");}if((ev[key]||"")!==v)saveDetails(id,{[key]:v});}}));
  return el("div",{class:"detailsform",style:"flex-basis:100%"},
    el("div",{class:"grid"},f("name","Event name"),f("date","Date","date"),f("time","Start time","time"),f("venue","Location")),
    id?null:el("p",{class:"muted small",style:"margin:0"},"Format, divisions and roster are in Live Event."),
    id?el("p",{class:"muted small",style:"margin:0"},"Changes save to this past event only and are logged."):null);}

/* ---------- import from the earlier version ---------- */
function importCard(){const st=S.imp=S.imp||{busy:false,err:"",done:""};
  const pick=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;st.busy=true;st.err="";schedule();
    try{const j=JSON.parse(await f.text());if(!j.docs)throw new Error("That file isn't an export from the earlier version.");
      const remap=j.ownerId?{[j.ownerId]:S.me.id}:{};const r=await LIF.importDocs(j.docs,remap);st.done=`Imported ${r.imported} records. Reloading…`;schedule();setTimeout(()=>location.reload(),1200);}
    catch(x){st.err=x.message||"Import failed";st.busy=false;schedule();}};
  return el("section",{class:"panel sec"},el("h2",{text:"Bring over your existing data"}),
    el("p",{class:"muted",style:"margin:0"},"Have an export file from the earlier version? Load it here to bring in your hitter and facility libraries and your last event."),
    el("div",{class:"row"},el("label",{class:"btn"},st.busy?"Importing…":"Choose export file",el("input",{type:"file",accept:".json,application/json",style:"display:none",disabled:st.busy,onchange:pick}))),
    st.err?el("div",{class:"note bad",text:st.err}):null,st.done?el("div",{class:"note",text:st.done}):null);}

/* ---------- boot ---------- */
window.addEventListener("hashchange",()=>{const h=(location.hash||"").slice(1);if(VIEWS.includes(h))S.view=h;S.confirm=null;S.modal=null;schedule()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.evModal){S.evModal=null;S.evDraft=null;}else if(S.warn)S.warn=null;else if(S.sub)S.sub=null;else if(S.modal)S.modal=null;else return;schedule();});
render();
(async()=>{const c=window.claude;if(!c||!c.use){S.noDb=true;schedule();return;}
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  if(!db){S.noDb=true;schedule();return;}
  S.db=db;S.user=user;if(!user)S.authReady=true;
  S.role=LIF.role()||null;
  window.addEventListener("htg-status",()=>schedule());
  window.addEventListener("htg-code-invalid",e=>{if(S.me.id)return;S.spectate=false;S.role="spectator";S.codeErr="That event code isn't active any more. Ask the director for the current one.";S.codeEntry=null;schedule();});
  if(user){try{const me=await user.me();S.me={id:me.id,isOwner:!!me.isOwner};}catch(e){}
    try{const full=await LIF.me();if(full&&!full.name)S.needName=true;}catch(e){}
    if(!S.me.id&&LIF.getCode())S.spectate=true;
    S.authReady=true;schedule();
    if(!S.me.isOwner){try{S.me.isOwner=!!(await user.isOwner());}catch(e){}}
    if(!S.me.id){let tries=0;const retry=async()=>{let id=null;try{id=await user.id();}catch(e){}
        if(id){S.me.id=id;schedule();}else if(++tries<6)setTimeout(retry,2500);};
      setTimeout(retry,1500);document.addEventListener("visibilitychange",()=>{if(!S.me.id&&!document.hidden){tries=0;retry();}});}}
  const timer=setTimeout(()=>{S.stale=true;S.loaded=true;schedule();},10000);
  const err=e=>{console.warn(e);schedule();};
  db.doc("event/main").onSnapshot(s=>{S._event=s.exists?s.data():null;S.loaded=true;
    if(!s.metadata.fromCache)ensureCode();if(!s.metadata.fromCache){clearTimeout(timer);S.stale=false;}schedule();},e=>{clearTimeout(timer);S.loaded=true;err(e)});
  db.doc("admin/state").onSnapshot(s=>{S._admin=s.exists?s.data():{};schedule();},err);
  db.doc("private/hitters").onSnapshot(s=>{S.priv=s.exists?s.data():(S.me.isOwner?{emails:{}}:null);S.privLoaded=!s.metadata.fromCache||s.exists;schedule();},()=>{});
  db.doc("private/library").onSnapshot(s=>{setTimeout(ensureCode,0);S.lib=s.exists?s.data():(S.me.isOwner?{hitters:{}}:null);S.libLoaded=!s.metadata.fromCache||s.exists;schedule();},()=>{});
  for(const col of ["joins","rr","commits","reveals"])db.collection(col).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S[col]=o;schedule();},err);
  db.collection("archive").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.archive=o;schedule();},()=>{});
  db.collection("vault").onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.vault=o;schedule();},err);
  schedule();})();
})();
</script>
